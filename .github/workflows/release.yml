name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  packages: write

env:
  NuGetPackageSourceCredentials_github: Username=x-access-token;Password=${{ secrets.GITHUB_TOKEN }}

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $tag = "${{ github.ref_name }}"
          $version = $tag.TrimStart('v')
          $isPrerelease = if ($version -match '-') { 'true' } else { 'false' }
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "prerelease=$isPrerelease" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore MyCarDb.slnx --configfile nuget.github.config

      - name: Publish
        run: >
          dotnet publish src/MyCarDb.Desktop/MyCarDb.Desktop.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:Version=${{ steps.ver.outputs.value }}

      - name: Bundle third-party licenses
        run: |
          Copy-Item THIRD_PARTY_LICENSES.md publish\
          Copy-Item -Recurse licenses publish\licenses

      - name: Create release archive
        run: Compress-Archive -Path publish\* -DestinationPath MyCarDb-win-x64-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          prerelease: ${{ steps.ver.outputs.prerelease }}
          files: MyCarDb-win-x64-${{ github.ref_name }}.zip

  image:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          secrets: |
            nuget_github=Username=x-access-token;Password=${{ secrets.GITHUB_TOKEN }}
          tags: |
            ghcr.io/corbini/mycardb:latest
            ghcr.io/corbini/mycardb:${{ github.ref_name }}

name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'
          cache: true
          cache-dependency-path: '**/*.csproj'

      - name: Compute version
        id: ver
        shell: pwsh
        run: |
          $version = "${{ github.ref_name }}".TrimStart('v')
          "value=$version" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Restore
        run: dotnet restore MyCarDb.slnx

      - name: Publish
        run: >
          dotnet publish src/MyCarDbView/MyCarDbView.csproj
          --configuration Release
          --runtime win-x64
          --self-contained true
          --output publish
          -p:Version=${{ steps.ver.outputs.value }}

      - name: Bundle third-party licenses
        run: |
          Copy-Item THIRD_PARTY_LICENSES.md publish\
          Copy-Item -Recurse licenses publish\licenses

      - name: Create release archive
        run: Compress-Archive -Path publish\* -DestinationPath MyCarDbView-win-x64-${{ github.ref_name }}.zip

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: ${{ github.ref_name }}
          generate_release_notes: true
          files: MyCarDbView-win-x64-${{ github.ref_name }}.zip
